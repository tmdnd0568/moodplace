<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>my MoodPlace</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/splash.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/review.css" />
  <link rel="stylesheet" href="css/reservation.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>

<body>
  <div class="app-shell" id="app">
    <!-- 스플래시 화면 (STEP 1) -->
    <section class="screen is-active" id="screen-splash" data-screen="splash">
      <div class="splash-content">
        <h1 class="splash-headline">무드에 맞는<br />장소를 찾아보세요</h1>

        <div class="splash-spacer-top" aria-hidden="true"></div>

        <div class="splash-center">
          <div class="splash-badge" aria-hidden="true">
            <svg viewBox="0 0 100 124" xmlns="http://www.w3.org/2000/svg">
              <!-- Pin (teardrop) -->
              <path d="M50 4C29 4 12 21 12 42c0 28 38 74 38 74s38-46 38-74C88 21 71 4 50 4z" fill="#2D5244" />
              <!-- White circle badge -->
              <circle cx="50" cy="42" r="27" fill="#FFFFFF" />
              <!-- Heart (sits at top rim of the circle) -->
              <path d="M50 29c-2.4-3.4-8-3.4-9.6 0.6-1.4 3.4 1.4 6.4 9.6 11.4 8.2-5 11-8 9.6-11.4-1.6-4-7.2-4-9.6-0.6z"
                fill="#2D5244" />
              <!-- Coffee cup -->
              <path d="M35 46h24v8a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8v-8z" fill="none" stroke="#2D5244" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" />
              <path d="M59 48h3.5a4 4 0 0 1 0 8H59" fill="none" stroke="#2D5244" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>

          <div class="splash-logo">
            <img src="assets/logo_01.png" alt="MoodPlace" class="splash-logo-img" />
          </div>

          <p class="splash-tagline">
            <span class="line"></span>
            <span>당신이 분위기에 맞는 공간을 찾다</span>
            <span class="line"></span>
          </p>
        </div>

        <div class="splash-spacer-bottom" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 메인 화면 (STEP 2) -->
    <section class="screen" id="screen-main" data-screen="main">
      <!-- main.js 가 이 컨테이너 내부를 렌더링합니다 -->
    </section>

    <!-- 리뷰 / 장소 상세 화면 (STEP 4) -->
    <section class="screen" id="screen-review" data-screen="review">
      <!-- review.js 가 이 컨테이너 내부를 렌더링합니다 -->
    </section>

    <!-- 예약 화면 (STEP 5) -->
    <section class="screen" id="screen-reservation" data-screen="reservation">
      <!-- reservation.js 가 이 컨테이너 내부를 렌더링합니다 -->
    </section>

    <!-- 지도 / 길찾기 안내 화면 (STEP 6) -->
    <section class="screen" id="screen-map" data-screen="map">
      <!-- map.js 가 이 컨테이너 내부를 렌더링합니다 -->
    </section>

    <!-- 무드 탐색 모달 (STEP 3) — 메인 화면 위에 뜨는 바텀시트 오버레이 -->
    <div class="search-modal-overlay" id="search-modal">
      <div class="search-modal-sheet" id="search-modal-sheet" role="dialog" aria-modal="true" aria-label="무드 탐색">
        <!-- search.js 가 이 컨테이너 내부를 렌더링합니다 -->
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/search.js"></script>
  <script src="js/review.js"></script>
  <script src="js/reservation.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
